name: Continuous Delivery Teste
on:
  push:
    branches:
      - main #só faz quando houver push na main

permissions:
  contents: read
  security-events: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Python Lint Code Scanning Action
        uses: advanced-security/python-lint-code-scanning-action@v1.1.3

      - name: Simulando Continuous Delivery
        uses: actions/upload-artifact@v7
        with:
          name: projetozipado.zip
          path: |
            **.py
            README.md

  deploy:
    runs-on: ubuntu-latest
    needs: deliver
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: projetozipado.zip
      - name: Display structure of downloaded files
        run: ls -R

  docker:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true #se der problema colocar false e comentar os logins ali em cima
          tags: user/app:latest